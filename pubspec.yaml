name: instasave
description: Download public Instagram reels, posts, and profile pictures.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  cached_network_image: ^3.3.1
  permission_handler: ^11.3.0
  gal: ^2.3.0
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  share_plus: ^7.2.2
  url_launcher: ^6.2.5
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  lottie: ^3.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  video_player: ^2.9.2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon_launcher.png
  adaptive_icon_background: "#C2185B"
  adaptive_icon_foreground: assets/icons/app_icon_launcher.png
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
